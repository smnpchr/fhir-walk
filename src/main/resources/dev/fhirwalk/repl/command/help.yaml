# What :help and :manual print. Edit the text here; no code needs to change.
#
# commands: every :command, in groups, in the order :help lists them and TAB offers
#   them. Each has
#     name     what is typed; must match a command the REPL defines (a test checks)
#     args     how its arguments are written, shown after the name
#     summary  one line, shown by :help and in the TAB menu
#     details  optional; more, shown by :help <command>
#     topic    optional; the :manual topic that explains it in context
#
# Quote a one-line value that holds " #" or ": ", as several here are: unquoted, YAML
# reads " #" as the start of a comment and silently drops the rest of the line.
#
# topics: the manual, one topic per subject, printed by :manual <name>. The text is
#   printed as it stands here, so keep its lines, and those of details, to 76
#   characters (a test checks). "all" is taken: :manual all prints every topic.

commands:
  - group: Pools
    commands:
      - name: ":load"
        args: "<path>"
        summary: import a file, bundle, NDJSON or directory tree
        topic: pools
      - name: ":pool"
        args: "[name]"
        summary: switch pool; alone, what is in the current one
        topic: pools
      - name: ":pools"
        args: ""
        summary: the open pools, their sizes and paths
        topic: pools
      - name: ":open"
        args: "<name> [path|dir@[rev]]"
        summary: "add a pool and switch to it: path loads, dir@rev is a git revision, dir@ its current branch"
        details: |
          :open specimen adds an empty pool; :open specimen <path> loads into it.
          :open in registry/in/import@branch/out opens a directory of a git
          repository at a revision; a bare @ follows the branch HEAD is on.
        topic: pools
      - name: ":close"
        args: "<name>"
        summary: drop a pool
        topic: pools
      - name: ":meta"
        args: "[name [dir [cut-off]]]"
        summary: "a meta pool: the bundles under a directory, read when asked for"
        details: |
          :meta exports archive 30d defines meta pool exports over the bundles
          under archive modified in the last 30 days, and reads it. :meta exports
          reads it again, :meta alone lists them. The definition is saved; the
          bundles are read only on :meta, never at startup.
        topic: meta
      - name: ":unmeta"
        args: "<name>"
        summary: forget a meta pool's definition, closing it
        topic: meta
      - name: ":cutoff"
        args: "[30d|12h|date|none]"
        summary: "the meta pool's cut-off: how recently a bundle was modified to count"
        details: |
          :cutoff 30d keeps the bundles modified in the last 30 days, :cutoff
          2026-10-01 those since then, :cutoff none all of them. The bundles are
          read again, and only those it lets in are parsed.
        topic: meta
      - name: ":members"
        args: "[text]"
        summary: the meta pool's bundles, most recently modified first, with their sizes and when
        topic: meta
      - name: ":fhir"
        args: "[version]"
        summary: switch FHIR version (resets the pool)
        details: |
          Loaded pools keep their names and lose their contents; git pools read
          their revision again in the new version.

  - group: Git history
    commands:
      - name: ":log"
        args: "[label] [n] [+skip]"
        summary: a git pool's line, newest first, with what each commit changed; with a label, the commits that changed that resource
        details: |
          :log 10 +20 is the 21st to 30th commit back. Alone it goes by files:
          a commit that only reformatted one counts. :log Specimen/s1 goes by
          the resource's content instead: a reformat, or a change to another
          resource in the same file, is left out; reordered extensions are not.
        topic: git
      - name: ":at"
        args: "<rev|date>"
        summary: move a git pool to a revision, or to its line as of a date (2026-03-11); TAB lists commits by date
        details: |
          A revision is a branch, tag, id or branch~2; a date such as 2026-03-11
          moves to the line as it was then.
        topic: git
      - name: ":step"
        args: "[-n|+n]"
        summary: move a git pool along its line; alone, one commit back
        details: |
          -1 is one commit back, +1 one forward along the line.
        topic: git
      - name: ":trace"
        args: "[label] [expr]"
        summary: how one resource, or an expression's answer for it, changed along a git pool's line; with a focus, the focused one
        details: |
          :trace Specimen/s1 type.coding.code lists the commits where the answer
          changed, with what it was before: by content, not by file, so a commit
          that changed the resource elsewhere is left out. A focused element is
          traced the same way, by the steps that reached it. :trace Specimen/s1
          alone traces the whole resource: the commits :log Specimen/s1 lists,
          each with what it holds. :more prints each answer whole, a resource as
          pretty-printed JSON. resolve() is refused: it would read the pool at
          its own revision, not the one traced.
        topic: git
      - name: ":delta"
        args: ""
        summary: what this revision added, modified and deleted
        topic: git
      - name: ":scope"
        args: "[delta|bundle|all]"
        summary: run pool-wide over the delta only, one bundle of a meta pool, or everything
        details: |
          In a meta pool TAB offers the bundles newest first. When none begins
          with what is typed, it offers those that contain it, so :scope 0017
          finds a bundle of a long name by its end.
        topic: git

  - group: Evaluating
    commands:
      - name: ":focus"
        args: "[label|#index|expr|[n]|..]"
        summary: evaluate against one resource or element
        details: |
          Alone, it clears the focus; .. steps back to the previous one.
        topic: focus
      - name: ":all"
        args: "<expr>"
        summary: evaluate across the whole pool
        topic: evaluating
      - name: ":why"
        args: "[expr]"
        summary: find the step where the expression goes empty
        topic: evaluating
      - name: ":ext"
        args: "[path]"
        summary: extension URLs observed in the pool
        topic: completion

  - group: Recorded expressions and views
    commands:
      - name: ":history"
        args: "[filter]"
        summary: recorded pool-wide expressions, newest first
        topic: recording
      - name: ":view"
        args: "#n|name|@view …"
        summary: "a table: one row per resource, a column per recorded expression"
        details: |
          Numbers come from :history, names from :name-expr, views from :name-view.
        topic: recording
      - name: ":name-expr"
        args: "[name [#n]]"
        summary: "name the expression just run, or #n, for :view; alone, list"
        topic: recording
      - name: ":unname-expr"
        args: "<name>"
        summary: forget an expression's name
        topic: recording
      - name: ":name-view"
        args: "[view]"
        summary: name and save the last :view, to rerun as :view @view; alone, list
        topic: recording
      - name: ":unname-view"
        args: "<view>"
        summary: forget a saved view
        topic: recording

  - group: Session
    commands:
      - name: ":workspace"
        args: "[name]"
        summary: switch workspace; alone, show it and list the others
        topic: workspaces
      - name: ":more"
        args: ""
        summary: reprint the last listing in full, nothing shortened
        topic: listings
      - name: ":limit"
        args: "[rows|off]"
        summary: rows per listing before the rest waits for :more
        topic: listings
      - name: ":help"
        args: "[command]"
        summary: this list; with a command, more about it
      - name: ":manual"
        args: "[topic]"
        summary: how it all fits together; alone, the topics
      - name: ":quit"
        args: ""
        summary: exit

topics:
  - name: evaluating
    title: Where an expression runs
    text: |
      With a focus set, an expression runs against that resource;
      with no focus it runs across the whole pool.

      :why with no expression re-diagnoses the last one you ran, so the
      hint printed after an empty result can be followed by just :why.

  - name: focus
    title: Focusing on a resource or an element
    text: |
      :focus also takes an expression: it runs against the current focus
      (or the pool) and its one result becomes the focus, which may be an
      element. Expressions then start from that element — coding.code,
      not Observation.code.coding — and :focus .. steps back up.
      :more right after :focus prints the focused value in full.
      :focus [n] picks row n of the last numbered listing, e.g. when
      an expression matched several values.

  - name: recording
    title: Recorded expressions, names and views
    text: |
      A pool-wide expression that matches something is recorded, once, in
      the workspace; :history lists them by number. :view #3 #5
      tabulates them: one row per resource of the type they start from,
      one column each. Columns must yield primitives, e.g. name.family
      rather than name; several values in one cell are joined with ", ".
      :name-expr family right after a pool-wide expression names it;
      :name-expr family #1 names a recorded one. Then :view family birth #3
      works and the column is titled family. A name holds the expression
      itself, not its number.
      :name-view people saves the last :view; :view @people reruns it.

  - name: pools
    title: Several pools
    text: |
      Several pools can be open at once, each with its own census and focus;
      resolve() stays inside the pool. :open specimen <path> adds one and
      switches to it, :pool <name> switches, :pools lists them. Recorded
      expressions, names and views are shared, so :view @people runs in any.

      A tree of exported bundles is a meta pool rather than many pools; see
      :manual meta.

  - name: meta
    title: Meta pools
    text: |
      A meta pool holds every Bundle under a directory, each as a part of
      one pool: resolve() stays inside the bundle a resource came from,
      while an expression runs over all of them. :meta exports archive 30d
      defines one and reads it; the definition is saved, the bundles are
      read only when :meta exports asks for them, never at startup.

      Each bundle is named by its path less the extension and what every
      path ends in: archive/specimen/2026-10-20-p1/bundle.json is
      specimen-2026-10-20-p1. A resource's label carries it,
      specimen-2026-10-20-p1:Patient/p1, so :focus and the rows of :all tell
      the bundles apart, and :all says in how many bundles it matched. The
      bundle's entry order is kept: #0 is the first entry of the first one.

      The cut-off is by file modification time: :cutoff 30d, :cutoff
      2026-10-01, :cutoff none. Files that are not one Bundle are skipped.
      :members lists the bundles; :scope specimen-r1 runs pool-wide over one,
      :scope all over every one again. Scoped to one, the prompt names it and
      rows leave it out: Patient/p1, which :focus finds in that bundle; :more
      prints the whole label.

  - name: git
    title: Pools from git revisions
    text: |
      A pool can be a directory in a git repository at a revision, read
      without checking anything out: :open in registry/in/import@branch/out.
      A bare @ opens the branch HEAD is on; TAB after the @ lists revisions.
      TAB after :at lists the line's commits by date, newest first.
      :log lists its line, :step -1 and :step +1 move along it, :at <rev>
      jumps. Moving sets the scope to the delta, so pool-wide expressions and
      :view run over what that commit changed, while resolve() still sees
      everything; :delta lists it, :scope all goes back to the whole pool.
      :log Specimen/s1 lists the commits that changed one resource, and
      :trace Specimen/s1 type.coding.code how an answer changed across them;
      :trace Specimen/s1 alone, how the resource itself did.

      Each counts a different kind of change. :log alone goes by the files
      git changed, so a reformat counts. :log Specimen/s1 and :trace
      Specimen/s1 go by the resource's content: a reformat, its keys in
      another order, or another resource in the same file changing does not
      count, while extensions or codings in another order do, since order is
      part of the content. :trace Specimen/s1 <expr> goes by the answer: a
      row only where it changed. Whitespace inside a string counts.

  - name: workspaces
    title: Workspaces
    text: |
      A workspace keeps the recorded expressions, names and views, the
      up-arrow history, and where the session was left: FHIR version,
      pools, :limit and focus, all restored at the next start. The default
      is ~/.fhir-walk; start with --workspace <name>, or :workspace <name>
      to switch. --fresh starts empty and keeps the saved state until
      something changes.

  - name: listings
    title: Long listings
    text: |
      A listing fills the window and keeps the rest for :more, which
      reprints it whole with no value shortened. :limit off prints
      everything up front and lets the terminal scroll.

  - name: completion
    title: Completion
    text: |
      TAB completes, including after :all and :why. On an empty line it
      lists the pool's resource types; after a '.' the elements and
      functions available there, with the ones present in the pool first;
      inside extension('…') the URLs observed on that element.
      Up/Down or further TABs walk the candidates; Enter takes the one shown.
